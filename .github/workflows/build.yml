name: Build NeoForge Mod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon

      - name: Verify JAR
        shell: bash
        run: |
          test -f build/libs/enderman_tower_bait_protection-1.0.0.jar
          ls -lh build/libs/enderman_tower_bait_protection-1.0.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: enderman_tower_bait_protection
          path: build/libs/enderman_tower_bait_protection-1.0.0.jar
          if-no-files-found: error